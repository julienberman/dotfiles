# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

# Global settings
palette = "catppuccin_mocha"
add_newline = true
command_timeout = 2000

format = """
[╭─](overlay1)$directory$git_branch$git_status$git_metrics
[╰─](overlay1)$character
"""

# ─────────────────────────────
# Prompt character
# ─────────────────────────────
[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"

[conda]
style = "lavender"
symbol = "🅒"
format = "[\\($environment\\)]($style)"

# ─────────────────────────────
# Username
# ─────────────────────────────
[username]
style_user = "lavender"
style_root = "maroon"
format = " [$user]($style) "
disabled = true 
show_always = true

# ─────────────────────────────
# Hostname
# ─────────────────────────────
[hostname]
ssh_only = false
format = "[//](overlay1 bold) [$hostname]($style) "
style = "lavender"
disabled = true

# ─────────────────────────────
# Directory
# ─────────────────────────────
[directory]
truncation_length = 0
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
format = "[ ](lavender)[$path](lavender)[$read_only](lavender) "
disabled = false 

# ─────────────────────────────
# Git branch
# ─────────────────────────────
[git_branch]
symbol = " "
format = "[git ](mauve)[$symbol](mauve)[$branch](rosewater) "


# ─────────────────────────────
# Git status
# ─────────────────────────────
[git_status]
disabled = false
format = "([$all_status$ahead_behind](mauve)) "

conflicted = " "
untracked  = " "
modified   = " "
staged     = " "
renamed    = " "
deleted    = " "
stashed    = "󰏗 "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "

[git_metrics]
disabled = false
format = "([+$added]($added_style) [-$deleted]($deleted_style)) "
added_style = "green"
deleted_style = "red"

# ─────────────────────────────
# Palette definitions
# ─────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle   = "#181825"
crust    = "#11111b"
