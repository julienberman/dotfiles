# herdr configuration
# Place this file at ~/.config/herdr/config.toml

# Disable first-run notification setup on startup.
onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#b4befe"
panel_bg = "#181825"
surface_dim = "#353749"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true

[keys]
prefix = "ctrl+a"
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"
split_horizontal = "prefix+h"
split_vertical    = "prefix+v"
new_tab   = "prefix+n"
close_tab = "prefix+x"
switch_tab = "ctrl+1..9"
workspace_picker = "prefix+w"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
switch_workspace="prefix+1..9"
copy_mode  = "prefix+c"
help = "prefix+?"
detach = "prefix+q"
reload_config = "prefix+shift+r"
rename_workspace = "prefix+r"
close_workspace = "prefix+d"
toggle_sidebar = "prefix+p"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_start_collapsed = true

# Collapsed sidebar presentation: "compact" keeps the narrow status rail, "hidden" uses zero width.
sidebar_collapsed_mode = "hidden"

mouse_capture = true
copy_on_select = true
confirm_close = false
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = false
agent_panel_sort = "spaces"
accent = "#f5c2e7"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

# Play sounds when agents change state in background workspaces
[ui.sound]
enabled = false

[session]
# resume_agents_on_restore = true

[remote]
# Whether herdr manages the ssh config used for `herdr --remote`.
# When true (default), herdr runs remote ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as fallbacks (so any keepalive values you set yourself
# still win) to survive idle network/NAT timeouts. Herdr also uses a private
# per-attach OpenSSH control socket to reuse the first authenticated connection.
# Set false to run plain ssh against your ssh config unchanged — this does not
# force keepalive or multiplexing off, it only stops herdr from adding its own.
# manage_ssh_config = true
